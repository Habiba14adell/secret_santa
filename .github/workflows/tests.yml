name: Tests

on: [push, pull_request]

jobs:
  flow:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: santa_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d santa_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m unittest discover -s tests -v
        env:
          TEST_DATABASE_URL: postgresql://postgres:test-only@localhost:5432/santa_test
