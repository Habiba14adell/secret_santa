services:
  - type: web
    name: merry-draw
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python serve.py
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.13
      - key: SANTA_SECRET_KEY
        generateValue: true
      - key: SANTA_ADMIN_PASSWORD_HASH
        sync: false
      - key: SANTA_SECURE_COOKIES
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: merry-draw-db
          property: connectionString
databases:
  - name: merry-draw-db
    plan: basic-256mb
    ipAllowList: []
